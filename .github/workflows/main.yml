      - name: Configurar (CMake + JUCE)
        run: cmake -S NematicTune -B build -A x64

      - name: Compilar el VST3
        run: cmake --build build --config Release --target NematicTune_VST3 --parallel

      - name: Empaquetar
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path build -Recurse -Directory -Filter "Nematic Tune.vst3" | Select-Object -First 1
          if (-not $bundle) { throw "No se encontro 'Nematic Tune.vst3' despues de compilar" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Path $bundle.FullName -Destination dist -Recurse
          Copy-Item -Path NematicTune\installer\* -Destination dist
          Compress-Archive -Path dist\* -DestinationPath Nematic-Tune-Windows.zip
          Get-ChildItem -Recurse dist | Select-Object FullName, Length

      - name: Publicar descarga
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Nematic-Tune-Windows.zip --repo "${{ github.repository }}" --title "Nematic Tune (Windows VST3) #${{ github.run_number }}" --notes "Descarga Nematic-Tune-Windows.zip, descomprimilo y ejecuta INSTALAR-Nematic-Tune.bat como administrador."
